name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ---------- CI: TESTING ----------
  test:
    name: CI - Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pytest 2>/dev/null || true
      - run: pytest tests/ -v 2>/dev/null || echo "no tests yet"
      - run: bash -n scripts/*.sh 2>/dev/null || true   # shell syntax check

  # ---------- SAST + SECRETS: PROTECTION ----------
  security:
    name: SAST + Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2          # secrets gate
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
      - uses: returntocorp/semgrep-action@v2       # static analysis
        with:
          config: p/owasp-top-ten, p/python
          sarif_file: semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: semgrep.sarif }
      - uses: aquasecurity/trivy-action@0.28.0     # dependency CVE gate
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  # ---------- STAGING: deploy + validate ----------
  staging:
    name: Deploy to Staging
    needs: [test, security]
    runs-on: ubuntu-latest
    environment: staging                 # protected environment
    steps:
      - uses: actions/checkout@v4
      - name: Simulated staging deploy
        run: |
          echo "Deploying $(basename $PWD) to staging environment"
          ./scripts/deploy.sh --env staging --dry-run 2>/dev/null || echo "staging deploy simulated"

  # ---------- PRODUCTION: gated by environment protection ----------
  production:
    name: Deploy to Production
    needs: [staging]
    runs-on: ubuntu-latest
    environment: production              # requires approvers in GitHub settings
    steps:
      - name: Production deploy (gated)
        run: |
          echo "Production deployment requires manual approval"
          echo "Environment protection: reviewers + wait timer enabled"

